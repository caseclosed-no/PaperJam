services:
  paperjam:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PAPERJAM_BACKEND: ${PAPERJAM_BACKEND:-${GAMEPRINTER_BACKEND:-dry-run}}
      PAPERJAM_CUPS_SERVER: ${PAPERJAM_CUPS_SERVER:-${GAMEPRINTER_CUPS_SERVER:-host.docker.internal:631}}
      PAPERJAM_BIND: 0.0.0.0:8080
      PAPERJAM_PDF_DIR: /app/data/pdfs
      PAPERJAM_STATE_DIR: /app/data/state
    volumes:
      - ./data/app.toml:/app/data/app.toml:ro
      - ./data/printer.toml:/app/data/printer.toml:ro
      - ./data/games:/app/data/games:ro
      - ${PAPERJAM_PDF_DIR:-${GAMEPRINTER_PDF_DIR:-./data/pdfs}}:/app/data/pdfs:ro
      # Keep the existing volume key to preserve inventory and run history.
      - gameprinter-state:/app/data/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  gameprinter-state:
